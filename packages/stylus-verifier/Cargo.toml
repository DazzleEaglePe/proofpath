[package]
name = "proofpath-verifier"
version = "0.1.0"
edition = "2024"
description = "Verificacion de Merkle proofs en Stylus. Solo verify_proof, nada mas."

[workspace]
members = ["merkle-core"]

[dependencies]
alloy-primitives = "1.5.7"
alloy-sol-types = "1.5.7"
stylus-sdk = "0.10.8"
# La logica de hashing vive aparte, sin la SDK, para poder testearla en nativo.
merkle-core = { path = "merkle-core" }

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]
# La usa el macro de la SDK para generar clientes; declararla evita los avisos
# de cfg desconocido en cada compilacion.
contract-client-gen = []

[profile.release]
# Stylus cobra por tamaño del wasm: se optimiza para tamaño.
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"
