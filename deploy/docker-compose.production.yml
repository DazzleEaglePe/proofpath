name: proofpath-production

services:
  postgres:
    image: postgres:17-alpine
    container_name: proofpath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: proofpath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el .env del servidor}
      POSTGRES_DB: proofpath
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - proofpath-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofpath -d proofpath"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  proofpath-postgres-data:
